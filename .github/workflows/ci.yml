name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pixels
          POSTGRES_USER: pixels
          POSTGRES_PASSWORD: pixels
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pixels -d pixels"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate database migrations
        run: docker run --rm --network host -v "$PWD:/workspace" -w /workspace liquibase/liquibase:4.31 --defaults-file=database/liquibase.ci.properties validate

      - name: Apply database migrations
        run: docker run --rm --network host -v "$PWD:/workspace" -w /workspace liquibase/liquibase:4.31 --defaults-file=database/liquibase.ci.properties update

  test:
    name: Test shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Test
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(go list ./... | awk -v n=4 -v s=${{ matrix.shard }} 'NR % n == s')
          mkdir -p covdata
          go test -race -count=1 -covermode=atomic -cover "${pkgs[@]}" -args -test.gocoverdir="$PWD/covdata"

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: covdata-${{ matrix.shard }}
          path: covdata
          retention-days: 1

  coverage:
    name: Check coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: covdata-*
          path: shards

      - name: Check coverage
        # The repository predates a usable coverage gate and currently measures
        # 49.9% overall. Ratchet the aggregate instead of rejecting declarative
        # packet packages individually; raise this baseline as coverage grows.
        env:
          COVERAGE_BASELINE: "49.5"
        run: |
          set -euo pipefail
          dirs="$(ls -d shards/covdata-* | paste -sd,)"
          go tool covdata merge "-i=$dirs" -o=covdata-merged
          go tool covdata textfmt -i=covdata-merged -o=coverage.out
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')"
          echo "Total coverage: ${coverage}% (ratchet baseline: ${COVERAGE_BASELINE}%)"
          awk -v coverage="$coverage" -v baseline="$COVERAGE_BASELINE" 'BEGIN { exit !(coverage >= baseline) }'
